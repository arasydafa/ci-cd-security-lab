name: PR Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-build:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run PR tests
        run: npm test
