name: Setup RBAC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply RBAC
        run: |
          cat <<'EOF' > rbac.yml
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: app-role
          rules:
            - apiGroups: [""]
              resources: ["*"]
              verbs: ["*"]
            - apiGroups: ["apps"]
              resources: ["*"]
              verbs: ["*"]
            - apiGroups: ["batch"]
              resources: ["*"]
              verbs: ["*"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: app-role-binding
          subjects:
            - kind: ServiceAccount
              name: app-sa
              namespace: default
          roleRef:
            kind: ClusterRole
            name: app-role
            apiGroup: rbac.authorization.k8s.io
          EOF
          kubectl apply -f rbac.yml
