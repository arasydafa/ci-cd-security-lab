id: oidc-misconfig
title: "OIDC Trust Done Right"
level: intermediate
topic: github-actions
category: security
estimated_time: 15m
points: 150
description: |
  This workflow assumes an AWS role with OIDC but mints no OIDC token, and the
  role trust policy lets any repository in the org assume it. Wire up OIDC
  properly and scope the trust to one repository and branch.
tags: [oidc, aws, iam, trust-policy]
prerequisites: [secrets-leak, permissions-overkill]
objectives:
  - Grant id-token write so GitHub mints an OIDC token for the role assumption
  - Scope the trust policy sub condition to one repository and branch
  - Verify static keys are gone and untrusted repos cannot assume the role
references:
  - page: github-actions
    label: OIDC authentication guide
validation:
  type: workflow-check
  expected:
    - should_contain: ["role-to-assume"]
    # Semantic checks: real OIDC needs the token permission, scoped trust, and no static keys.
    - predicate: no-rule-findings
      rules: [oidc-missing-id-token, broad-oidc-trust, aws-access-key, hardcoded-credential]
scoring:
  hints_used_penalty: 30
  time_bonus: 75
