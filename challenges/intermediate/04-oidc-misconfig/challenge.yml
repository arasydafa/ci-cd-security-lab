id: oidc-misconfig
title: "OIDC Trust Done Right"
level: intermediate
topic: github-actions
category: security
estimated_time: 15m
points: 150
description: |
  This workflow uses OIDC for AWS authentication but the trust policy
  is too broad. Any repository in your org can assume the role.
  Lock down the OIDC trust to specific repositories and branches.
tags: [oidc, aws, iam, trust-policy]
validation:
  type: workflow-check
  expected:
    - should_contain: ["role-to-assume"]
    # Semantic check: no static keys anywhere (scripts, env, or with: blocks).
    - predicate: no-rule-findings
      rules: [aws-access-key, hardcoded-credential]
scoring:
  hints_used_penalty: 30
  time_bonus: 75
