id: self-hosted-risk
title: "Self-Hosted Runner Risk"
level: intermediate
topic: github-actions
category: security
estimated_time: 15m
points: 150
description: |
  This workflow uses self-hosted runners without container isolation.
  A malicious PR could persist on the runner and compromise future builds.
  Switch to GitHub-hosted runners or add container isolation.
tags: [runners, isolation, supply-chain]
prerequisites: []
objectives:
  - Explain how persistent runners carry state between jobs
  - Use ephemeral runners or isolate self-hosted ones
references:
  - page: github-actions
    label: Runner security guide
validation:
  type: workflow-check
  expected:
    # Semantic check: no persistent self-hosted runners.
    - predicate: no-rule-findings
      rules: [self-hosted-runner]
scoring:
  hints_used_penalty: 30
  time_bonus: 75
