id: artifact-tampering
title: "Artifact Integrity"
level: intermediate
topic: github-actions
category: security
estimated_time: 15m
points: 150
description: |
  This workflow uploads build artifacts without integrity checks.
  An attacker could tamper with artifacts between build and deploy.
  Add checksums to verify artifact integrity.
tags: [artifacts, integrity, checksums]
prerequisites: [unsafe-deps]
objectives:
  - Generate checksums at build time
  - Verify integrity before deploy
references:
  - page: github-actions
    label: Artifact integrity guide
validation:
  type: workflow-check
  expected:
    - should_contain: ["sha256sum"]
scoring:
  hints_used_penalty: 30
  time_bonus: 75
