name: Deploy Microservices

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy services
        run: |
          cat <<'EOF' > services.yml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                containers:
                  - name: frontend
                    image: frontend:latest
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: api
            template:
              metadata:
                labels:
                  app: api
              spec:
                containers:
                  - name: api
                    image: api:latest
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: database
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: database
            template:
              metadata:
                labels:
                  app: database
              spec:
                containers:
                  - name: database
                    image: postgres:16
          EOF
          kubectl apply -f services.yml
