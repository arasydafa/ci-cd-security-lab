id: mon-silent-failure
title: "Silent Failures"
level: intermediate
topic: monitoring
category: best-practice
estimated_time: 15m
points: 150
description: |
  This workflow fails silently — broken steps are hidden with continue-on-error,
  and there are no failure notifications. Bad deploys go unnoticed for hours.
  Remove error suppression and add failure alerts.
tags: [monitoring, alerts, error-handling]
prerequisites: [mon-no-build-status, error-swallowing]
objectives:
  - Remove error suppression from security steps
  - Add failure alerts that reach a human
references:
  - page: monitoring
    label: Failure alerts guide
validation:
  type: workflow-check
  expected:
    - should_not_contain: ["continue-on-error: true"]
scoring:
  hints_used_penalty: 30
  time_bonus: 75
