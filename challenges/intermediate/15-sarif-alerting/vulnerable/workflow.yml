name: Security Scan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        run: trivy fs --format sarif --output results.sarif .

      - name: Run tests
        run: npm test
