id: script-injection
title: "Script Injection Defense"
level: intermediate
topic: github-actions
category: security
estimated_time: 15m
points: 150
description: |
  This workflow is vulnerable to script injection via GitHub context
  variables. An attacker can craft PR titles or issue bodies that
  execute arbitrary code. Sanitize all user-controlled inputs.
tags: [injection, github-context, script-execution]
prerequisites: [secrets-leak]
objectives:
  - Explain how expression substitution runs before the shell
  - Route untrusted context through env indirection
  - Verify the fix with a simulation run
references:
  - page: github-actions
    label: Script injection guide
validation:
  type: workflow-check
  expected:
    # Semantic check: untrusted contexts must not be interpolated into run:
    # scripts. Env-var indirection (the taught fix) passes; any direct
    # ${{ github.event.* }} / ${{ inputs.* }} usage fails, with line numbers.
    - predicate: no-interpolation-in-run
scoring:
  hints_used_penalty: 30
  time_bonus: 75
