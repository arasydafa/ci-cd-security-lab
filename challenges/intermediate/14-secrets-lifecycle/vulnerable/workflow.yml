name: Deploy with Debug

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "Checking available secrets..."
          echo "${{ toJSON(secrets) }}"

      - name: Deploy
        env:
          DEPLOY_TOKEN: FILL_ME_FROM_SECRETS
        run: ./deploy.sh
