id: secrets-leak
title: "Don't Leak Your Secrets"
level: beginner
topic: github-actions
category: security
estimated_time: 10m
points: 100
description: |
  This workflow accidentally leaks AWS credentials in the build logs.
  Find the secrets exposure and fix it before an attacker can harvest your keys.
tags: [secrets, aws, logging]
prerequisites: []
objectives:
  - Explain how AWS credentials reach build logs through echo and env dumps
  - Route credentials through secrets and env without printing values
  - Verify with simulation that no secret value appears in output
references:
  - page: github-actions
    label: Secrets handling guide
validation:
  type: workflow-check
  expected:
    # Semantic checks: no leaked keys, no hardcoded credentials, no secret echo.
    - predicate: no-rule-findings
      rules: [aws-access-key, hardcoded-credential, secrets-echo-expression]
scoring:
  hints_used_penalty: 25
  time_bonus: 50
