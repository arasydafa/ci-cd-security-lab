id: permissions-overkill
title: "Too Much Power"
level: beginner
topic: github-actions
category: security
estimated_time: 8m
points: 75
description: |
  This workflow uses overly broad permissions. A compromised step could
  modify code, create releases, or access other repository resources.
  Apply the principle of least privilege.
tags: [permissions, least-privilege]
validation:
  type: workflow-check
  expected:
    # Semantic checks: no broad grants, and permissions declared explicitly
    # (least privilege). Replaces the old write-all substring match.
    - predicate: no-write-all
    - predicate: has-explicit-permissions
scoring:
  hints_used_penalty: 25
  time_bonus: 30
