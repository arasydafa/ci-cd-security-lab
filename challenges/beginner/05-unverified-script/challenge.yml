id: unverified-script
title: "Verify Before You Run"
level: beginner
topic: github-actions
category: security
estimated_time: 10m
points: 100
description: |
  This workflow downloads and executes a remote script without verification.
  An attacker could modify the script to inject malicious code.
  Always verify checksums before executing downloaded code.
tags: [supply-chain, script-execution]
validation:
  type: workflow-check
  expected:
    # Semantic check: remote scripts must never be piped straight to a shell.
    - predicate: no-rule-findings
      rules: [curl-pipe-shell, wget-pipe-shell]
scoring:
  hints_used_penalty: 25
  time_bonus: 50
