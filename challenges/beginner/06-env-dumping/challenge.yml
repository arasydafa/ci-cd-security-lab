id: env-dumping
title: "Debugging Gone Wrong"
level: beginner
topic: github-actions
category: security
estimated_time: 10m
points: 100
description: |
  This workflow dumps environment variables to the logs for debugging.
  But environment variables include secrets — and CI logs are stored forever.
  Remove the env dump to prevent credential exposure.
tags: [secrets, logging, env]
prerequisites: [secrets-leak]
objectives:
  - List what lives in a job environment beyond your own variables
  - Remove debug dumps from workflows
  - Mask values that must be printed
references:
  - page: github-actions
    label: Secrets handling guide
validation:
  type: workflow-check
  expected:
    # Semantic check: no environment dumps that would leak secrets.
    - predicate: no-rule-findings
      rules: [env-dump]
scoring:
  hints_used_penalty: 25
  time_bonus: 50
