name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@cicd-lab/shared

      - name: Build simulator
        run: npm run build --workspace=@cicd-lab/simulator

      - name: Run simulator tests
        run: npm run test --workspace=@cicd-lab/simulator

      - name: Build CLI
        run: npm run build --workspace=@cicd-lab/cli

      - name: Authoring gate (schema + fixtures + evasions)
        run: node packages/cli/dist/index.js validate
