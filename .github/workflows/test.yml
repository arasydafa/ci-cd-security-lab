name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+: the test runner expands ** globs itself (Node 20 cannot)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@cicd-lab/shared

      - name: Build simulator
        run: npm run build --workspace=@cicd-lab/simulator

      - name: Run simulator tests
        run: npm run test --workspace=@cicd-lab/simulator

      - name: Diagnose CLI module tree
        run: |
          node --version
          npm --version
          ls node_modules/chalk node_modules/commander
          ls packages/cli/node_modules 2>/dev/null || echo "no nested cli node_modules"
          node -e "console.log(require.resolve('chalk', { paths: ['packages/cli'] }))"

      - name: Build CLI
        run: npm run build --workspace=@cicd-lab/cli

      - name: Authoring gate (schema + fixtures + evasions)
        run: node packages/cli/dist/index.js validate
