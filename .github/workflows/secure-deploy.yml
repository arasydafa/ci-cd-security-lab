name: Secure Deploy App (Simulation)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # read-only — build never needs write access

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          echo "Simulating npm ci..."
          echo "Installed from package-lock.json (simulated — no registry contact)"
        # In production: npm ci
        # npm ci installs exact versions from package-lock.json
        # Node.js is pre-installed on GitHub runners — no setup needed

      - name: Dependency Audit
        run: |
          echo "Simulating npm audit --audit-level=high..."
          echo "No high-severity vulnerabilities found (simulated)"
        # In production, replace with: npm audit --audit-level=high
        # (npm audit contacts the npm registry — simulated for this lab)

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build
        # Runs the real build script from package.json (copies src/ to dist/)

      - name: Generate Artifact Checksum
        run: |
          cd dist
          sha256sum * > checksum.txt
          echo "--- Computed checksums ---"
          cat checksum.txt
        # Real SHA256 hashes for artifact integrity verification

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # OIDC — no static AWS credentials needed

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify Artifact Checksum
        run: |
          if [ -f dist/checksum.txt ]; then
            echo "--- Stored checksums ---"
            cat dist/checksum.txt
            echo "--- Recomputing and verifying ---"
            cd dist
            sha256sum -c checksum.txt
          else
            echo "No checksum.txt found — skipping verification"
          fi
        # Re-hashes files and compares against stored checksums

      - name: Configure AWS Credentials (OIDC)
        run: |
          echo "Simulating OIDC-based AWS authentication..."
          echo "Requesting OIDC token from GitHub..."
          echo "Assuming IAM role: arn:aws:iam::123456789012:role/GitHubActionsRole"
          echo "Temporary credentials obtained successfully (simulated)"
        # In production, replace this simulation with:
        #   uses: aws-actions/configure-aws-credentials@v4
        #   with:
        #     role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsRole
        #     aws-region: us-east-1
        # OIDC requires an identity provider in AWS IAM:
        #   Provider URL: https://token.actions.githubusercontent.com
        #   Audience:     sts.amazonaws.com
        # The key point: no static keys stored — credentials are temporary.

      - name: Deploy to S3
        run: |
          echo "::add-mask::${{ github.sha }}"
          echo "Deploying commit ${{ github.sha }} to s3://secure-bucket/"
          if [ -d dist/ ]; then
            ls -la dist/
          else
            echo "No dist/ folder found (artifact may not have downloaded)"
          fi
          # In production: aws s3 sync dist/ s3://secure-bucket/ --delete
          echo "Deployment completed successfully"
        # ::add-mask:: hides the value from all subsequent log output
