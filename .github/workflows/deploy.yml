name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "Checkout omega-os sibling (pinned v1.0.1 - bump tag on omega-os releases)"
        run: git clone --depth 1 --branch v1.0.1 https://github.com/arasydafa/omega-os.git ../omega-os

      - name: Install dependencies
        run: npm ci

      - name: Build OmegaOS dist (gitignored, never present in fresh clones)
        run: |
          npm --prefix ../omega-os ci --no-audit --no-fund
          npm --prefix ../omega-os run build

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './packages/web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
